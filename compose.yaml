---
services:
  tanjunbot:
    build: .
    image: ghcr.io/tanjunbot/new_tanjun:latest
    container_name: tanjunbot
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Berlin
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
