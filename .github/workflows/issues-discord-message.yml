name: Issue closed - Notify Discord
on:
  issues:
    types: [closed]

permissions:
  contents: read

jobs:
  notify_discord:
    runs-on: ubuntu-latest
    steps:
      - name: Post update on Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TITLE: ${{ github.event.issue.title }}
          BODY: ${{ github.event.issue.body }}
          AUTHOR_NAME: ${{ github.event.issue.user.login }}
          AUTHOR_URL: https://github.com/${{ github.event.issue.user.login }}
          AUTHOR_ICON: https://avatars.githubusercontent.com/${{ github.event.issue.user.login }}
          TIMESTAMP: ${{ github.event.issue.closed_at }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is not configured; skipping notification."
            exit 0
          fi
          JSON_PAYLOAD=$(jq -n \
            --arg color "5763719" \
            --arg username "Tanjun Issue Tracker" \
          '{
            "content": null,
            "embeds": [
              {
                "title": ("[Closed]: " + env.TITLE),
                "description": env.BODY,
                "color": ($color | tonumber),
                "author": {
                  "name": env.AUTHOR_NAME,
                  "url": env.AUTHOR_URL,
                  "icon_url": env.AUTHOR_ICON
                },
                "footer": {
                  "text": ("Issue #" + env.ISSUE_NUMBER)
                },
                "timestamp": env.TIMESTAMP
              }
            ],
            "username": $username,
            "attachments": []
          }')
          curl --fail --silent --show-error --max-time 30 \
            -X POST -H 'Content-Type: application/json' \
            -d "$JSON_PAYLOAD" "$DISCORD_WEBHOOK_URL"
