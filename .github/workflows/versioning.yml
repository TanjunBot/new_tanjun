name: Version Bump

on:
  pull_request:
    types: [closed]
    branches:
      - development
  push:
    branches:
      - main
      - master

concurrency:
  group: version-bump-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bump_version:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Bump version
        id: bump_version
        run: |
          current_version=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r major minor patch <<< "$current_version"
          patch=$((patch + 1))
          new_version="$major.$minor.$patch"
          echo "$new_version" > VERSION
          echo "new=$new_version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        env:
          NEW_VERSION: ${{ steps.bump_version.outputs.new }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "chore: bump version to ${NEW_VERSION} [ignore changelog]"
          git tag -a "${NEW_VERSION}" -m "Version ${NEW_VERSION}"
          git push origin development
          git push origin "${NEW_VERSION}"

  create_release_branch:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute release version
        id: release
        run: |
          current_version=$(tr -d '[:space:]' < VERSION)
          IFS='.' read -r major minor patch <<< "$current_version"
          minor=$((minor + 1))
          release_version="${major}.${minor}.0"
          release_branch="ver/${major}.${minor}"
          echo "version=${release_version}" >> "$GITHUB_OUTPUT"
          echo "branch=${release_branch}" >> "$GITHUB_OUTPUT"

      - name: Create or update release branch
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git fetch origin main master 2>/dev/null || true
          base_ref=origin/main
          if ! git rev-parse --verify "${base_ref}" >/dev/null 2>&1; then
            base_ref=origin/master
          fi

          branch_exists=false
          if git ls-remote --exit-code --heads origin "${RELEASE_BRANCH}" >/dev/null 2>&1; then
            branch_exists=true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "${RELEASE_BRANCH}" "${base_ref}"
          echo "${RELEASE_VERSION}" > VERSION
          git add VERSION
          git commit -m "chore: set version to ${RELEASE_VERSION} [ignore changelog]"

          if [ "${branch_exists}" = true ]; then
            git push origin "${RELEASE_BRANCH}" --force-with-lease
          else
            git push origin "${RELEASE_BRANCH}"
          fi
