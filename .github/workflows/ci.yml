name: Tanjun CI

on:
  push:
    branches-ignore:
      - l10n*
  pull_request:
    branches:
      - development
      - master
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit to test'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'
  RUFF_VERSION: '0.11.5'

jobs:
  import-smoke:
    name: Import Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-asyncio
      - run: python scripts/check_diagnostics_manifest.py
      - run: python scripts/audit_command_tree_payloads.py
      - run: python scripts/generate_locale_api.py --check
      - run: python scripts/check_locales.py
      - run: pytest tests/test_locale_completeness.py -q
      - run: pytest tests/unit/core/test_app_imports.py -q

  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff==${{ env.RUFF_VERSION }}
      - run: ruff check . --fix --exit-zero
      - run: ruff format .
      - run: python scripts/lint_tests.py
      - run: python scripts/lint_channel_select.py
      - run: python scripts/lint_view_initial_embed.py

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: python -m mypy . --explicit-package-bases --no-error-summary --show-error-codes --soft-error-limit -1 2>&1

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [import-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: COVERAGE_FILE=coverage-unit.dat pytest tests/unit/ -n auto --cov=. --cov-report=xml:coverage-unit.xml --cov-fail-under=0 -q
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: |
            coverage-unit.dat
            coverage-unit.xml

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [import-smoke]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: |
          docker compose -f docker-compose.test.yml up -d --wait
        timeout-minutes: 3
      - run: |
          export TANJUN_INTEGRATION=true
          COVERAGE_FILE=coverage-integration.dat pytest tests/integration/ -m "not slow and not live_discord" --cov=. --cov-report=xml:coverage-integration.xml --cov-fail-under=0 -q
          pytest tests/e2e/ -m "not slow" -q
        env:
          TANJUN_INTEGRATION: true
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-integration
          path: |
            coverage-integration.dat
            coverage-integration.xml

  test-e2e-live:
    name: E2E Live Discord (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run live Discord tests
        if: env.TANJUN_TEST_BOT_TOKEN != ''
        run: pytest tests/e2e_live/ -m live_discord -v --timeout=120
        env:
          TANJUN_TEST_BOT_TOKEN: ${{ secrets.TANJUN_TEST_BOT_TOKEN }}
          TANJUN_TEST_GUILD_ID: ${{ secrets.TANJUN_TEST_GUILD_ID }}
          TANJUN_TEST_CHANNEL_ID: ${{ secrets.TANJUN_TEST_CHANNEL_ID }}

  test-coverage-gate:
    name: Coverage Gate (85% total + per-file)
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install coverage
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          merge-multiple: true
          path: coverage-parts
      - run: |
          cd coverage-parts
          coverage combine coverage-*.dat
          coverage xml -o ../coverage.xml
          coverage json -o ../coverage.json
          coverage report --fail-under=85
          mv .coverage ../
          cd ..
          python scripts/check_coverage_per_file.py --min 85 --coverage-json coverage.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: coverage.xml
      - uses: codecov/codecov-action@v5
        if: github.event_name == 'pull_request'
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [import-smoke, lint, type-check, test-coverage-gate]
    if: |
      always() && (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/development' ||
        github.ref == 'refs/heads/dev' ||
        startsWith(github.ref, 'refs/heads/ver/')
      )
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Extract commit information
        run: |
          echo "title=$(git log --format=%s -1 HEAD)" >> $GITHUB_ENV
          echo "author_name=$(git log -1 --pretty=format:'%an' HEAD)" >> $GITHUB_ENV
          echo "commit_hash=$(git log -1 --pretty=format:'%H' HEAD)" >> $GITHUB_ENV
          echo "timestamp=$(git log -1 --pretty=format:'%cI' HEAD)" >> $GITHUB_ENV
      - name: Post update on Discord
        if: ${{ !contains(env.title, '[ignore changelog]') }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          SMOKE="${{ needs.import-smoke.result }}"
          LINT="${{ needs.lint.result }}"
          TYPE="${{ needs.type-check.result }}"
          TEST="${{ needs.test-coverage-gate.result }}"
          if [ "$SMOKE" = "success" ] && [ "$LINT" = "success" ] && [ "$TYPE" = "success" ] && [ "$TEST" = "success" ]; then
            COLOR="5763719"; DESC="All checks passed"
          else
            COLOR="15548997"; DESC="Checks failed (Smoke:$SMOKE Lint:$LINT Type:$TYPE Test:$TEST)"
          fi
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"embeds\":[{\"title\":\"$title\",\"description\":\"$DESC\",\"color\":$COLOR}]}" \
            "$DISCORD_WEBHOOK_URL" || true
