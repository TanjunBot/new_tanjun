name: Tanjun CI

on:
  push:
    branches-ignore:
      - l10n*
  pull_request:
    branches:
      - development
      - master
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch/tag/commit to test'
        required: false
        type: string

env:
  PYTHON_VERSION: '3.12'
  RUFF_VERSION: '0.11.5'

jobs:
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Ruff
        run: pip install ruff==${{ env.RUFF_VERSION }}

      - name: Run Ruff Linter
        run: ruff check . --output-format=github

      - name: Check Ruff Formatting
        run: ruff format --check . --diff

  type-check:
    name: Type Check (Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Mypy
        run: |
          mypy . \
            --explicit-package-bases \
            --no-error-summary \
            --show-error-codes \
            --soft-error-limit -1 2>&1
        continue-on-error: true

  test:
    name: Tests (pytest with coverage)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: tanjun_test
          MARIADB_USER: test_user
          MARIADB_PASSWORD: test_password
        ports:
          - 3307:3306
        options: >-
          --health-cmd="healthcheck.sh --su-mysql --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install pytest pytest-cov pytest-asyncio

      - name: Run tests with coverage
        env:
          TANJUN_DB_HOST: 127.0.0.1
          TANJUN_DB_PORT: 3307
          TANJUN_DB_USER: test_user
          TANJUN_DB_PASSWORD: test_password
          TANJUN_DB_NAME: tanjun_test
        run: |
          pytest --cov=. --cov-report=term --cov-report=xml --junitxml=test-results.xml -v

      - name: Upload coverage to Codecov
        if: github.event_name == 'pull_request'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

      - name: Upload test results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: test-results.xml

  notify:
    name: Discord Notification
    runs-on: ubuntu-latest
    needs: [lint, type-check, test]
    if: |
      always() && (
        github.ref == 'refs/heads/master' ||
        github.ref == 'refs/heads/development' ||
        github.ref == 'refs/heads/dev' ||
        startsWith(github.ref, 'refs/heads/ver/')
      )
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Extract commit information
        id: commit_info
        run: |
          COMMIT_TITLE=$(git log --format=%s -1 HEAD)
          GITHUB_AUTHOR_NAME=$(git log -1 --pretty=format:'%an' HEAD)
          COMMIT_HASH=$(git log -1 --pretty=format:'%H' HEAD)
          COMMIT_TIMESTAMP=$(git log -1 --pretty=format:'%cI' HEAD)

          echo "title=$COMMIT_TITLE" >> $GITHUB_ENV
          echo "author_name=$GITHUB_AUTHOR_NAME" >> $GITHUB_ENV
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_ENV
          echo "timestamp=$COMMIT_TIMESTAMP" >> $GITHUB_ENV

      - name: Check commit message
        id: check_skip
        run: |
          if [[ "${{ env.title }}" == *"[ignore changelog]"* ]]; then
            echo "skip=true" >> $GITHUB_ENV
          else
            echo "skip=false" >> $GITHUB_ENV
          fi

      - name: Post update on Discord
        if: env.skip != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is not set."
            exit 1
          fi

          LINT_STATUS="${{ needs.lint.result }}"
          TYPE_STATUS="${{ needs.type-check.result }}"
          TEST_STATUS="${{ needs.test.result }}"
          OVERALL="${{ needs.test.result }}"

          if [ "$LINT_STATUS" = "success" ] && [ "$TYPE_STATUS" = "success" ] && [ "$TEST_STATUS" = "success" ]; then
            COLOR="5763719"
            DESCRIPTION="All checks passed ✅"
          else
            COLOR="15548997"
            DESCRIPTION="Checks failed ❌ (Lint: $LINT_STATUS, Type: $TYPE_STATUS, Test: $TEST_STATUS)"
          fi

          JSON_PAYLOAD=$(jq -n \
            --arg title "$title" \
            --argjson color "$COLOR" \
            --arg description "$DESCRIPTION" \
            --arg author_name "$author_name" \
            --arg author_url "https://github.com/${{ github.actor }}" \
            --arg author_icon "https://avatars.githubusercontent.com/${{ github.actor }}" \
            --arg footer_text "$commit_hash" \
            --arg timestamp "$timestamp" \
            --arg username "Tanjun CI" \
            --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          '{
            "content": null,
            "embeds": [
              {
                "title": $title,
                "description": $description,
                "color": $color,
                "url": $run_url,
                "author": {
                  "name": $author_name,
                  "url": $author_url,
                  "icon_url": $author_icon
                },
                "footer": {
                  "text": $footer_text
                },
                "timestamp": $timestamp
              }
            ],
            "username": $username,
            "attachments": []
          }')

          for i in {1..5}; do
            response=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H 'Content-Type: application/json' \
              -d "$JSON_PAYLOAD" \
              "$DISCORD_WEBHOOK_URL")
            if [ "$response" -eq 204 ] || [ "$response" -eq 200 ] || [ "$response" -eq 201 ]; then
              echo "Discord notification sent (HTTP $response)."
              break
            fi
            sleep 10
          done
          if ! ( [ "$response" -eq 204 ] || [ "$response" -eq 200 ] || [ "$response" -eq 201 ] ); then
            echo "::error::Failed to send Discord notification after 5 attempts (Last HTTP: $response)."
            exit 1
          fi
