name: Test

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  unit-and-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests with coverage
        run: pytest tests/unit -m "not slow" -q --cov --cov-report= --cov-fail-under=0
      - name: Run integration tests with coverage
        run: |
          pytest tests/integration -m "not slow and not live_discord" \
            --cov --cov-append --cov-report=term-missing --cov-fail-under=85 -q
      - name: Run mock E2E tests
        run: pytest tests/e2e/ -m "not slow" -q
      - name: Check command test coverage mapping
        run: python scripts/check_command_test_coverage.py
      - name: Check diagnostics command tree manifest
        run: python scripts/check_diagnostics_manifest.py

  integration-db:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Start test database
        run: docker compose -f docker-compose.test.yml up -d --wait
      - name: Run database integration tests
        env:
          TANJUN_INTEGRATION: "true"
          TANJUN_TEST_DB_HOST: 127.0.0.1
          TANJUN_TEST_DB_PORT: "3307"
          TANJUN_TEST_DB_USER: test_user
          TANJUN_TEST_DB_PASSWORD: test_password
          TANJUN_TEST_DB_NAME: tanjun_test
        run: |
          pytest tests/integration/api/test_db_read_cache_live.py \
            tests/integration/api/test_db_read_cache.py \
            tests/integration/api/test_api_integration.py -v --timeout=120
      - name: Stop test database
        if: always()
        run: docker compose -f docker-compose.test.yml down -v
