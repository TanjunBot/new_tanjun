---
services:
  test-db:
    image: mariadb:11
    container_name: tanjun-test-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: test
      MARIADB_DATABASE: tanjun_test
      MARIADB_USER: test
      MARIADB_PASSWORD: test
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
